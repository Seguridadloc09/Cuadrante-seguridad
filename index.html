<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadrante de Seguridad</title>
<style>
  :root {
    --bg:#f3f4f6; --card:#ffffff; --ink:#1d2433; --muted:#667085; --line:#d0d5dd;
    --naranja:#FFC000; --naranja2:#FF9E00;
    --franco:#FFFF00; --vaca:#F4B084; --doble:#C6E0B4; --find:#BDD7EE; --inval:#A6A6A6;
    --feri:#E1BEE7;
    --total:#92D050; --obj:#FFF2CC; --okbg:#C6EFCE; --oktx:#006100; --badbg:#FFC7CE; --badtx:#C00000;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .banner { margin:16px; border-radius:14px; padding:18px 20px; color:#3d2e00;
            background:linear-gradient(90deg,var(--naranja),var(--naranja2));
            display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between;
            box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .banner h1 { font-size:22px; margin:0; letter-spacing:.5px; }
  .meta { font-size:12px; opacity:.85; margin-top:3px; }
  .meta b { font-weight:700; }
  button { font:inherit; border:0; background:rgba(255,255,255,.92); color:#1d2433; border-radius:8px;
           padding:8px 16px; cursor:pointer; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  button:disabled { opacity:.6; cursor:default; }
  .kpis { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 8px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; min-width:120px; border-top:4px solid var(--c,#999); }
  .kpi b { display:block; font-size:19px; }
  .kpi span { color:var(--muted); font-size:12px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px; padding:4px 16px 12px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--card);
          border:1px solid var(--line); border-radius:999px; padding:3px 10px 3px 4px; }
  .sw { width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.15); }
  .err { color:var(--badtx); font-weight:600; padding:0 16px 8px; }
  .wrap { margin:0 16px 24px; background:var(--card); border:1px solid var(--line); border-radius:12px;
          overflow:auto; max-height:78vh; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  table { border-collapse:separate; border-spacing:0; }
  th, td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); height:30px; min-width:30px;
           padding:0; text-align:center; font-size:12px; }
  thead th { position:sticky; z-index:2; background:var(--naranja); color:#3d2e00; font-weight:800; }
  thead tr.sem th { top:0; height:24px; font-size:11px; letter-spacing:1px; }
  thead tr.dia th { top:24px; height:30px; font-size:13px; }
  thead th.lbl, td.lbl { position:sticky; left:0; z-index:1; text-align:left; min-width:170px; max-width:220px; padding:0 10px; }
  thead th.lbl { z-index:3; }
  td.lbl { background:var(--card); font-weight:600; font-size:12.5px; }
  td.hor { min-width:52px; font-size:11px; color:var(--muted); }
  td.wk  { background:var(--find); }
  td.inv { background:var(--inval); }
  th.fe  { background:var(--feri) !important; }
  td.fe  { background:var(--feri); }
  td.hoy { outline:3px solid #111; outline-offset:-3px; }
  td.f   { background:var(--franco); font-weight:700; }
  td.vac { background:var(--vaca); font-weight:700; font-size:10.5px; }
  td.tmtn{ background:var(--doble); font-weight:700; font-size:10.5px; }
  tr.grupo td { background:var(--naranja); color:#3d2e00; font-weight:800; font-size:15px; text-align:left;
                padding:6px 10px; height:40px; border-bottom:2px solid #b98a00; }
  tr.tot td.lbl { font-weight:700; }
  tr.tot.tman td { background:#DDEBF7; }
  tr.tot.tdia td { background:var(--total); font-weight:800; }
  tr.tot.tper td { background:#e9f5e0; }
  tr.tot.tobj td { background:var(--obj); }
  tr.tot.tdif td { font-weight:800; }
  td.ok  { background:var(--okbg); color:var(--oktx); }
  td.bad { background:var(--badbg); color:var(--badtx); }
  td.st  { background:#f2f4f7; color:var(--muted); font-size:11px; min-width:44px; }
  thead th.st { background:#e4e7ec; color:var(--ink); font-size:10px; }
  .foot { margin:0 16px 24px; color:var(--muted); font-size:11px; }
  @media (max-width:600px) {
    .wrap, .banner, .foot { margin-left:10px; margin-right:10px; }
    .kpis, .legend, .err { padding-left:10px; padding-right:10px; }
    th.lbl, td.lbl { min-width:130px; }
  }
</style>
</head>
<body>
<div class="banner">
  <div>
    <h1 id="titulo">Cuadrante de Seguridad</h1>
    <div class="meta" id="meta">Cargando…</div>
  </div>
  <button id="btn" type="button">Actualizar</button>
</div>
<div class="kpis" id="kpis"></div>
<div class="legend" id="legend"></div>
<div class="err" id="err"></div>
<div class="wrap"><table id="grid"></table></div>
<div class="foot">Los datos se leen directamente de la planilla de Google Sheets publicada en la web. Puede haber una demora de unos minutos entre la edición y la actualización del CSV (caché de Google).</div>

<script>
'use strict';
// ===================== CONFIGURACIÓN =====================
// 1) En Google Sheets: Archivo → Compartir → Publicar en la web → Hoja1 → CSV → Publicar.
// 2) Pegar abajo el enlace que genera (empieza con https://docs.google.com/spreadsheets/d/e/2PACX-...).
var CONFIG = {
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvWeV2IcFueuAH6F6061tGHLpykIbZzdv1FIhxtvij5yTrC_ebKtf7BovX5jzAZ77k56CIf0-uxTsl/pub?gid=0&single=true&output=csv',
  REFRESH_SECONDS: 120
};
// ==========================================================

var MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function $(id){ return document.getElementById(id); }

function parseCSV(text){
  var rows = [], row = [], field = '', inQ = false;
  for (var i = 0; i < text.length; i++){
    var ch = text[i];
    if (inQ){
      if (ch === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += ch;
    } else if (ch === '"'){ inQ = true; }
    else if (ch === ','){ row.push(field); field = ''; }
    else if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch !== '\r'){ field += ch; }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function cell(row, i){ return (row && i < row.length) ? String(row[i]).trim() : ''; }

function findRow(rows, label){
  for (var r = 0; r < rows.length; r++){
    if (cell(rows[r], 0).toLowerCase() === label.toLowerCase()) return r;
  }
  return -1;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtFechaHora(v){
  // acepta "dd/mm/yyyy hh:mm(:ss)" o variantes de Google
  var m = String(v).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return v;
  return m[1].padStart(2,'0') + '/' + m[2].padStart(2,'0') + '/' + m[3] + ' ' + m[4].padStart(2,'0') + ':' + m[5] + ' hs';
}

function marcaClass(v){
  var s = v.toUpperCase();
  if (s === 'F') return 'f';
  if (s === 'VAC') return 'vac';
  if (s === 'TM TN') return 'tmtn';
  return '';
}

function render(rows){
  var i, r, c;
  // ---- encabezado / meta ----
  var mesTxt = cell(rows[0], 1), anio = cell(rows[0], 4);
  var titulo = cell(rows[0], 7) || (mesTxt + ' ' + anio);
  var ultMod = cell(rows[0], 15); // P1: lo escribe el Apps Script onEdit
  $('titulo').textContent = 'Cuadrante de Seguridad — ' + titulo;
  document.title = 'Cuadrante ' + titulo;
  var metaHtml = '';
  if (ultMod) metaHtml += 'Última modificación de la planilla: <b>' + esc(fmtFechaHora(ultMod)) + '</b> · ';
  metaHtml += 'Vista actualizada: ' + new Date().toLocaleTimeString('es-AR');
  $('meta').innerHTML = metaHtml;

  // ---- KPIs desde el resumen ----
  var kpiDefs = [
    ['Horas totales del mes', '#FF9E00'],
    ['Promedio personal por día', '#2563eb'],
    ['Mínimo personal en un día', '#e11d48'],
    ['Días bajo el objetivo', '#c026d3'],
    ['Horas trabajadas en feriados', '#7b1fa2'],
    ['Personas sobre el tope', '#b42318']
  ];
  var khtml = '';
  kpiDefs.forEach(function(k){
    var ri = findRow(rows, k[0]);
    if (ri >= 0) khtml += '<div class="kpi" style="--c:' + k[1] + '"><b>' + esc(cell(rows[ri],1)) + '</b><span>' + esc(k[0]) + '</span></div>';
  });
  $('kpis').innerHTML = khtml;

  // ---- leyenda ----
  $('legend').innerHTML =
    '<span class="chip"><span class="sw" style="background:var(--franco)"></span>F = Franco</span>' +
    '<span class="chip"><span class="sw" style="background:var(--vaca)"></span>VAC = Vacaciones</span>' +
    '<span class="chip"><span class="sw" style="background:var(--doble)"></span>TM TN = Doble turno</span>' +
    '<span class="chip"><span class="sw" style="background:#fff"></span>NT = Turno noche</span>' +
    '<span class="chip"><span class="sw" style="background:#fff"></span>9a17 = Horario especial</span>' +
    '<span class="chip"><span class="sw" style="background:var(--find)"></span>Fin de semana</span>' +
    '<span class="chip"><span class="sw" style="background:var(--feri)"></span>FE = Feriado</span>' +
    '<span class="chip"><span class="sw" style="background:var(--total)"></span>Totales</span>';

  // ---- columnas de días (2..32 = C..AG) ----
  var rMan = findRow(rows, 'Turno Mañana');
  if (rMan < 0) throw new Error('No se encontró "Turno Mañana" en la hoja.');
  var numRow = rows[rMan + 1];
  var dayCols = [];
  for (c = 2; c <= 32; c++){
    if (cell(numRow, c) !== '') dayCols.push(c);
  }
  var ndays = dayCols.length;
  var letters = {};
  for (i = 0; i < dayCols.length; i++) letters[dayCols[i]] = cell(rows[rMan], dayCols[i]);

  // feriados (fila "Feriado" con marca FE por día)
  var feri = {};
  var rFeri = findRow(rows, 'Feriado');
  if (rFeri >= 0){
    for (i = 0; i < dayCols.length; i++){
      if (cell(rows[rFeri], dayCols[i]) === 'FE') feri[dayCols[i]] = true;
    }
  }

  // tope mensual de horas (para pintar en rojo a quien lo supera)
  var tope = 1e9;
  var rTope = findRow(rows, 'Tope de horas mensuales');
  if (rTope >= 0){
    var t = parseFloat(cell(rows[rTope], 1));
    if (!isNaN(t)) tope = t;
  }

  // hoy (solo si el mes/año de la planilla es el actual)
  var hoyCol = -1;
  var now = new Date();
  var mesNum = MESES_LARGO.indexOf(mesTxt.toLowerCase()) + 1;
  if (mesNum === now.getMonth() + 1 && parseInt(anio, 10) === now.getFullYear()){
    var dHoy = now.getDate();
    if (dHoy <= ndays) hoyCol = dayCols[dHoy - 1];
  }

  // ---- tabla ----
  var h = '<thead>';
  h += '<tr class="sem"><th class="lbl">Personal</th><th class="st">Hs</th>';
  for (i = 0; i < dayCols.length; i++){
    var cl = 'sem' + (dayCols[i] === hoyCol ? ' hoy' : '') + (feri[dayCols[i]] ? ' fe' : '');
    h += '<th class="' + cl + '">' + esc(letters[dayCols[i]]) + '</th>';
  }
  h += '<th class="st">F</th><th class="st">Días</th><th class="st">Horas</th></tr>';
  h += '<tr class="dia"><th class="lbl">Nombre</th><th class="st">Horario</th>';
  for (i = 0; i < dayCols.length; i++){
    var cd = dayCols[i];
    h += '<th class="' + (cd === hoyCol ? 'hoy' : '') + (feri[cd] ? ' fe' : '') + '">' + esc(cell(numRow, cd)) + '</th>';
  }
  h += '<th class="st">Francos</th><th class="st">Días trab.</th><th class="st">Horas mes</th></tr></thead><tbody>';

  // bloques de turnos
  var bloques = [
    ['Turno Mañana', 'Turno Tarde'],
    ['Turno Tarde', 'Turno Noche'],
    ['Turno Noche', null]
  ];
  var stopLabels = ['horas mañana','horas tarde','horas noche','horas diarias'];
  bloques.forEach(function(b){
    var rIni = findRow(rows, b[0]);
    if (rIni < 0) return;
    var rFin = rows.length;
    for (r = rIni + 2; r < rows.length; r++){
      var lbl = cell(rows[r], 0).toLowerCase();
      if (lbl.indexOf('turno ') === 0 || stopLabels.indexOf(lbl) >= 0){ rFin = r; break; }
    }
    h += '<tr class="grupo"><td colspan="' + (2 + ndays + 3) + '">' + esc(b[0].toUpperCase()) + '</td></tr>';
    for (r = rIni + 2; r < rFin; r++){
      var nombre = cell(rows[r], 0);
      if (!nombre) continue;
      h += '<tr><td class="lbl">' + esc(nombre) + '</td><td class="hor">' + esc(cell(rows[r], 1)) + '</td>';
      for (i = 0; i < dayCols.length; i++){
        var cc = dayCols[i];
        var v = cell(rows[r], cc);
        var cls = marcaClass(v);
        if (!cls && feri[cc]) cls = 'fe';
        if (!cls && (letters[cc] === 'S' || letters[cc] === 'D')) cls = 'wk';
        if (cc === hoyCol) cls += (cls ? ' ' : '') + 'hoy';
        h += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(v) + '</td>';
      }
      var horasPers = parseFloat(cell(rows[r], 35));
      var clsHoras = (!isNaN(horasPers) && horasPers > tope) ? 'st bad' : 'st';
      h += '<td class="st">' + esc(cell(rows[r], 33)) + '</td>' +
           '<td class="st">' + esc(cell(rows[r], 34)) + '</td>' +
           '<td class="' + clsHoras + '">' + esc(cell(rows[r], 35)) + '</td></tr>';
    }
  });

  // filas de totales
  var tots = [
    ['Horas Mañana', 'tman'], ['Horas Tarde', 'tman'], ['Horas Noche', 'tman'],
    ['HORAS DIARIAS', 'tdia'], ['Personal presente', 'tper'], ['Horas objetivo', 'tobj'], ['Diferencia', 'tdif']
  ];
  tots.forEach(function(t){
    var ri = findRow(rows, t[0]);
    if (ri < 0) return;
    h += '<tr class="tot ' + t[1] + '"><td class="lbl">' + esc(t[0]) + '</td><td class="hor"></td>';
    for (var i2 = 0; i2 < dayCols.length; i2++){
      var c2 = dayCols[i2];
      var val = cell(rows[ri], c2);
      var cls2 = '';
      if (t[0] === 'Diferencia' && val !== '') cls2 = (parseFloat(val) < 0) ? 'bad' : 'ok';
      h += '<td' + (cls2 ? ' class="' + cls2 + '"' : '') + '>' + esc(val) + '</td>';
    }
    h += '<td class="st"></td><td class="st"></td><td class="st"></td></tr>';
  });

  h += '</tbody>';
  $('grid').innerHTML = h;
}

var timer = null;
function cargar(){
  var btn = $('btn');
  btn.disabled = true; btn.textContent = 'Cargando…';
  $('err').textContent = '';
  if (!CONFIG.CSV_URL || CONFIG.CSV_URL.indexOf('http') !== 0){
    $('err').textContent = 'Falta configurar la URL del CSV: editar el index.html y pegar el enlace de "Publicar en la web" en CONFIG.CSV_URL.';
    btn.disabled = false; btn.textContent = 'Actualizar';
    return;
  }
  fetch(CONFIG.CSV_URL + '&_=' + Date.now(), { cache: 'no-store' })
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function(text){
      render(parseCSV(text));
    })
    .catch(function(e){
      $('err').textContent = 'No se pudo cargar la planilla: ' + e.message + '. Verificar que esté publicada en la web (Archivo → Compartir → Publicar en la web).';
    })
    .finally(function(){
      btn.disabled = false; btn.textContent = 'Actualizar';
    });
}

$('btn').addEventListener('click', cargar);
cargar();
timer = setInterval(cargar, CONFIG.REFRESH_SECONDS * 1000);
</script>
</body>
</html>
